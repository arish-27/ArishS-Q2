services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: voiceagent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voiceagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voiceagent_secret}
      POSTGRES_DB: ${POSTGRES_DB:-voiceagent_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voiceagent} -d ${POSTGRES_DB:-voiceagent_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: voiceagent_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voiceagent_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-voiceagent}:${POSTGRES_PASSWORD:-voiceagent_secret}@postgres:5432/${POSTGRES_DB:-voiceagent_db}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENCRYPTION_SECRET_KEY=${ENCRYPTION_SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-gemini}
      - DEFAULT_GEMINI_MODEL=${DEFAULT_GEMINI_MODEL:-gemini-3.5-flash-lite}
      - DEFAULT_GEMINI_FALLBACK_MODEL=${DEFAULT_GEMINI_FALLBACK_MODEL:-gemini-3.8-flash}
      - LLM_FIRST_TOKEN_TIMEOUT_S=${LLM_FIRST_TOKEN_TIMEOUT_S:-8}
      - DEFAULT_STT_PROVIDER=${DEFAULT_STT_PROVIDER:-faster-whisper}
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-small}
      - WHISPER_ENGLISH_MODEL_SIZE=${WHISPER_ENGLISH_MODEL_SIZE:-small.en}
      - WHISPER_BEAM_SIZE=${WHISPER_BEAM_SIZE:-1}
      - WHISPER_CPU_THREADS=${WHISPER_CPU_THREADS:-0}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - DEFAULT_TTS_PROVIDER=${DEFAULT_TTS_PROVIDER:-edge-tts}
      - VAD_SILENCE_THRESHOLD_MS=${VAD_SILENCE_THRESHOLD_MS:-700}
      - VAD_SPEECH_START_THRESHOLD=${VAD_SPEECH_START_THRESHOLD:-0.6}
      - VAD_SPEECH_END_THRESHOLD=${VAD_SPEECH_END_THRESHOLD:-0.45}
      - VAD_ENERGY_MULTIPLIER=${VAD_ENERGY_MULTIPLIER:-2.0}
      - VAD_MIN_SPEECH_MS=${VAD_MIN_SPEECH_MS:-200}
      - VAD_MAX_UTTERANCE_S=${VAD_MAX_UTTERANCE_S:-12}
      - VOICE_MAX_SESSION_SECONDS=${VOICE_MAX_SESSION_SECONDS:-900}
      - WS_MAX_MESSAGE_BYTES=${WS_MAX_MESSAGE_BYTES:-65536}
      - WS_RATE_LIMIT_CONNECTIONS=${WS_RATE_LIMIT_CONNECTIONS:-20}
      - WS_RATE_LIMIT_WINDOW_SECONDS=${WS_RATE_LIMIT_WINDOW_SECONDS:-60}
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-gemini-embedding-001}
      - HF_HOME=/opt/hf_cache
      - UPLOAD_STORAGE_DIR=/app/uploads
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voiceagent_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/api/v1/voice/stream}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:3000/\", (r) => { if (r.statusCode < 400) process.exit(0); else process.exit(1); })'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
